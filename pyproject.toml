[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder"
version = "0.5.0"
description = "Early warning for first-year dropout: an audited rebuild of a course project"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emanuele Restivo" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
# imbalanced-learn is only needed to reproduce the original notebook's SMOTE defect.
audit = ["imbalanced-learn>=0.12"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "imbalanced-learn>=0.12", "matplotlib>=3.8"]

[project.scripts]
pathfinder = "pathfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src/pathfinder"]
ignore_missing_imports = true
warn_unused_ignores = true
